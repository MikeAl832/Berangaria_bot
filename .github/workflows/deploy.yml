name: Deploy Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Syntax check (py_compile)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Security scan (bandit)
        run: bandit -q -ll -r . -x ./.venv,./tests

      - name: Run tests
        run: pytest -q

  deploy:
    # Only trusted main pushes/manual runs may reach the production runner.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64, berangaria-cursor]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy on cursor
        env:
          DEPLOY_SHA: ${{ github.sha }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          USER_BRIDGE_SESSION: ${{ secrets.USER_BRIDGE_SESSION }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: bash scripts/deploy-cursor.sh

name: Deploy Bot

on:
  push:
    branches: [ main ]

# Два push подряд иначе запускают docker compose одновременно в одном каталоге
# на VPS. Очередь, а не отмена: незавершённый деплой оставил бы прод в
# промежуточном состоянии.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Syntax check (py_compile)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Версии проверочных инструментов закреплены: без пина релиз ruff
          # ломает сборку push'а, который ничего относящегося не менял.
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # AGENTS.md makes bandit part of the mandatory gate; any medium/high
      # finding must be resolved before hand-off, so CI has to enforce it.
      - name: Security scan (bandit)
        run: bandit -q -ll -r . -x ./.venv,./tests

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests yet — skipping"; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # TTS only for now. Same pattern can later cover TELEGRAM_*/API_KEY/etc.
          # Values never printed — only key names in deploy logs.
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # This VPS exposes SSH on its non-default hardening port.
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 10m
          # Forward env into the remote script (appleboy does not pass `env:` alone).
          envs: FISH_API_KEY,FISH_VOICE_ID
          
          script: |
            set -eu

            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            
            mkdir -p ~/apps/Berangaria_bot
            cd ~/apps/Berangaria_bot
            
            if [ ! -d ".git" ]; then
              echo "Repository not found. Cloning..."
              # The repository is public; HTTPS avoids requiring a second
              # deploy key on the target VPS just to fetch the source.
              git clone https://github.com/${{ github.repository }}.git .
            else
              # This used to be `git pull --ff-only origin main`. It refuses to run
              # after any history rewrite on main: the server's branch stops being an
              # ancestor of origin/main, the step fails, and shipping then needs a
              # manual SSH session — which is the opposite of what CD is for.
              # The server checkout is a mirror of origin/main, not somebody's working
              # tree: the very next line already demands an exact match with
              # github.sha, so a hard sync loses nothing.
              # `reset --hard` does not touch untracked files, so the bind-mounted
              # bot_data/ and qdrant_storage/ state survives.
              echo "Repository exists. Syncing to origin/main..."
              git fetch --prune origin main
              git reset --hard FETCH_HEAD
            fi

            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            # --- TTS secrets → server .env (untracked; survives git reset --hard) ---
            # Empty GitHub secret leaves any existing line alone, so a missing
            # Actions secret cannot wipe a working key already on the VPS.
            upsert_env() {
              key="$1"
              value="$2"
              touch .env
              if [ -z "$value" ]; then
                echo "Skipping ${key} (GitHub secret empty/unset — keeping server .env as-is)"
                return 0
              fi
              if grep -qE "^${key}=" .env 2>/dev/null; then
                grep -vE "^${key}=" .env > .env.upsert.tmp || true
                mv .env.upsert.tmp .env
              fi
              # printf only; never echo the value (would land in Actions logs).
              printf '%s=%s\n' "$key" "$value" >> .env
              echo "Upserted ${key} into .env"
            }
            upsert_env FISH_API_KEY "${FISH_API_KEY:-}"
            upsert_env FISH_VOICE_ID "${FISH_VOICE_ID:-}"
            
            docker compose up -d --build --remove-orphans --force-recreate

            # `up -d` returns as soon as containers are created. Under
            # `restart: always` a crash-looping bot still produced a green
            # workflow, so wait for the startup banner from berangaria/app.py.
            echo "Waiting for the bot to report a successful start..."
            for attempt in $(seq 1 30); do
              if docker compose logs bot --since 120s 2>/dev/null | grep -q 'Бот запущен'; then
                echo "Bot started."
                exit 0
              fi
              if [ "$(docker compose ps -q bot | xargs -r docker inspect -f '{{.State.Restarting}}')" = "true" ]; then
                echo "Bot container is restarting — deployment failed."
                docker compose logs bot --tail 100
                exit 1
              fi
              sleep 4
            done

            echo "Bot did not report a successful start within the timeout."
            docker compose logs bot --tail 100
            exit 1

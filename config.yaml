# ========================================
# 🤖 ОСНОВНАЯ МОДЕЛЬ (OpenRouter)
# ========================================
# Чат и суммаризация идут на OpenRouter. Память (Mem0 extractor/verifier) — отдельно на DeepSeek.
"model": "openai/gpt-5.6-luna"
"chat_api_url": "https://openrouter.ai/api/v1/chat/completions"
# Хостер модели на OpenRouter. auto = сам выбирает (цена+аptime).
# Иначе slug с карточки модели: openai (скидка Luna), azure, amazon-bedrock.
"chat_provider": "openai"
"chat_provider_allow_fallbacks": true     # если выбранный хостер лёг — пробовать остальных
"max_context_tokens": 32000  # Максимальная история контекста
"max_reply_tokens": 4096     # Максимальный размер ответа

# Параметры генерации. OpenRouter отбрасывает то, что конкретная модель не поддерживает
# (например repetition_penalty / top_k у OpenAI). Можно добавить reasoning: {effort: medium}.
"generation_params":
  "temperature": 0.8

# Temperature for factual answers after a search / link read (lower = fewer hallucinations).
# Applied only after web_search/read_url — stickers and reactions no longer trigger it.
"factual_temperature": 0.4
"streaming_enabled": true                  # Потоковые ответы чат-модели и Telegram preview
"stream_update_interval_seconds": 0.8      # Не чаще одного обновления preview за этот интервал
"stream_preview_min_chars": 12             # Не показывать первые слишком короткие обрывки ответа

# ========================================
# 👁️ VISION (Распознавание картинок/видео)
# ========================================
"vision_mode": true                      # Включить распознавание изображений и видео
"gemini_model": "gemini-3.5-flash-lite"  # Gemini model (GA since 2026-07-21, free tier available).
                                         # gemini-3.1-flash-lite is deprecated, shutdown 2027-05-07 — this is its official replacement.
                                         # gemini-2.0-flash is already shut down; gemini-2.5-flash shuts down 2026-10-16.
"video_max_duration_sec": 300            # Максимальная длительность видео (секунды). Потолок по весу — video_max_file_size_bytes: 20 МБ в облачном Bot API, 2 ГиБ в local mode
"audio_max_duration_sec": 300            # Максимальная длительность голосовых/аудио (секунды)

# Настройки загрузки видео в Gemini Files API
"gemini_upload_max_wait_sec": 180        # Макс. время ожидания препроцессинга видео в Gemini (секунды). Длинным роликам нужно больше
"gemini_upload_backoff_initial": 0.5     # Начальная задержка между попытками опроса статуса (секунды)
"gemini_upload_backoff_max": 5.0         # Максимальная задержка между попытками (секунды)

# ========================================
# 🧠 ПАМЯТЬ (Mem0 + Embeddings)
# ========================================
"mem0_llm_model": "deepseek-v4-flash"    # Отдельная модель DeepSeek для Mem0
"embedding_model": "gemini-embedding-2"  # Gemini API embedding (бесплатно, multilingual)
"embedding_dims": 768                    # Размерность векторов
"memory_search_limit": 8                 # Сколько фактов подмешивать в контекст (больше=лучше контекст)
"memory_min_score": 0.3                  # Нижний vector floor; затем обязательны SQLite approval и тематическое совпадение
"memory_max_chars": 1200                 # Максимальная длина блока памяти (bigger=больше контекста)
"memory_flush_interval_seconds": 900     # Периодический retry SQLite-очереди памяти
"memory_query_min_chars": 12             # Минимальная содержательная длина query для поиска по памяти
"memory_query_recent_messages": 3        # Сколько последних содержательных сообщений объединять для memory search
"memory_queue_batch_size": 20             # Сколько сообщений-источников проверять за один проход
"memory_waiting_max_age_seconds": 1800   # Через сколько секунд зависший в waiting источник хоронится
"memory_source_retention_seconds": 2592000  # Сколько хранить завершённые строки очереди источников (30 дней)
"max_buffered_messages": 30              # Потолок склейки debounce-буфера по числу сообщений
"max_buffered_chars": 20000              # Потолок склейки debounce-буфера по символам

# ========================================
# 🎨 СТИКЕРЫ (векторный поиск в Qdrant)
# ========================================
"sticker_enabled": true                  # Включить инструмент send_sticker
"sticker_collection": "stickers"         # Имя коллекции Qdrant (отдельно от mem0)
"sticker_dims": 768                      # Размерность векторов (совпадает с embedding_dims)
"sticker_min_score": 0.25                # Cosine floor; v3 RU catalogue aligns better — 0.25 is less empty than 0.28
"sticker_top_k": 8                       # Top vector hits; one is picked at random among them
"sticker_auto_sync": true                # Sync catalogue → Qdrant on bot start
"sticker_sync_file": "data/stickers_clean.json"  # Catalogue (.json array or .jsonl); path relative to repo root
"sticker_sync_max_per_start": 0          # 0 = all missing; else cap N per start (quota)
"sticker_index_version": 3               # Bump when embed text formula or catalogue schema changes → full rewrite once
"sticker_send_max_per_turn": 2           # Max one-shot send_sticker(query) tries per turn (1 retry if miss)

# ========================================
# 🔊 TTS (Fish Audio → Telegram voice notes)
# ========================================
# Secrets: FISH_API_KEY + FISH_VOICE_ID in .env. Without them the tool stays off.
"tts_enabled": true                      # Master switch; also requires API key + voice id
"tts_model": "s2.1-pro-free"             # Fish model header (free tier until ~2026-08-31; then s2.1-pro)
"tts_format": "opus"                     # Telegram voice notes prefer ogg/opus
"tts_latency": "normal"                  # normal | balanced | low
"tts_sample_rate": 48000                 # Opus default; leave 48000 unless you know better
"tts_max_chars": 400                     # Hard cap on spoken text (voice ≠ essay)
"tts_timeout_seconds": 45                # HTTP timeout for one synthesis
"tts_max_per_turn": 1                    # At most one voice note per turn
"tts_default_emotion": "calm"            # Applied when the model omits emotion (empty = none)

# ========================================
# 🔍 SEARCH
# ========================================
"web_search_max_per_turn": 2             # Max web_search calls per reply (query + one retry). The DDG limit is process-global

# ========================================
# 💬 MULTI-MESSAGE (send_messages tool)
# ========================================
"multi_message_max": 3                   # Max bubbles per burst (min 2 enforced in code)
"multi_message_max_chars": 280           # Max characters per bubble
"multi_message_max_total_chars": 600     # Max total characters across the burst
"multi_message_delay_min": 0.4           # Min pause between bubbles (seconds)
"multi_message_delay_max": 2.0           # Max pause between bubbles (seconds)
"multi_message_delay_total_cap": 5.0     # Cap on sum of all inter-bubble pauses
"multi_message_chars_per_sec": 28.0      # Scales pause by message length (typing feel)

# ========================================
# ⚙️ ПОВЕДЕНИЕ БОТА
# ========================================
"bot_names": ["Бер", "Ber"]             # Имена на которые откликается бот
"random_reply_chance": 10                # Шанс случайного ответа в группе (%)
"summary_interval": 10                   # Сколько сообщений оставить после сжатия истории
"timezone": "Europe/Moscow"              # Часовой пояс бота (Time-теги, CURRENT TIME, cron суммаризации)
"summary_hours": [5]                     # Автосуммаризация в эти часы по timezone (сейчас только 05:00 МСК)
"message_debounce_seconds": 4.0          # Таймаут для склейки последовательных сообщений (секунды)
"random_reply_cooldown": 10              # Минимальный интервал между случайными ответами (секунды)
"admin_mode": false                      # true = только админы используют опасные команды
"debug": false                           # Показывать промпты в консоли (DEBUG режим)
"full_debug_logs": true                  # Полные промпты/ответы/память в DEBUG-файл и Dozzle; это чувствительные данные
"verbose": false                         # Суперподробные логи: HTTP, TLS, H2 (включает debug)
"log_file": "bot.log"                    # Путь к файлу логов при локальном запуске; Docker переопределяет на /data/bot.log
"log_max_bytes": 10485760                # Размер одного файла лога до ротации (10 МБ)
"log_backup_count": 5                    # Сколько архивных файлов лога хранить
"log_message_preview_chars": 400          # Сколько символов входящего текста показывать в INFO-логе

# ========================================
# 🔐 ДОСТУП (Telegram ID)
# ========================================
"allowed_users": [1217938322, 1809564460]  # Первый ID — владелец/создатель бота
"allowed_groups": [-1002263830880]
"admin_alert_chat_id": null              # null = личка owner; укажи chat id для другого места

# ========================================
# 👀 USER BRIDGE (видеть сообщения других ботов в группах)
# ========================================
# Read-only MTProto sidecar (Telethon). Ответы, tools, memory path — только Bot API.
# Secrets: TELEGRAM_API_ID, TELEGRAM_API_HASH, USER_BRIDGE_SESSION в .env / GitHub Secrets.
# Выключено по умолчанию: без session бот работает как раньше.
"user_bridge_enabled": true
"user_bridge_chat_ids": []               # пусто = пересечение с allowed_groups; иначе явный allowlist
"user_bridge_reconnect_seconds": 5       # пауза между reconnect при обрыве session/сети
"user_bridge_media_timeout_seconds": 60  # таймаут download+vision на одно bot-media
"user_bridge_dedup_ttl_seconds": 300     # окно дедупа (chat_id, message_id)

# ========================================
# 💰 ЦЕНЫ основной чат-модели (за 1M токенов)
# ========================================
# openai/gpt-5.6-luna на OpenRouter, текущая скидка 50% (вход $0.10 / кэш $0.01 / выход $0.60).
# Cache write у GPT-5.6 = 1.25× входа. Если OpenRouter вернул usage.cost — берём его.
"price_prompt_cache_miss": 0.10          # Обычные входные токены
"price_prompt_cache_hit": 0.01           # Прочитанные из кэша
"price_prompt_cache_write": 0.125        # Запись в кэш (1.25× входа)
"price_completion": 0.60                 # Выходные токены

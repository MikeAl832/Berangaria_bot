x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    labels:
      - dev.berangaria.logs=visible
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    logging: *default-logging
    restart: always

  bot:
    build: .
    init: true
    labels:
      - dev.berangaria.logs=visible
    env_file: .env
    environment:
      - BOT_DB_PATH=/data/bot_state.db
      - BOT_LOG_FILE=/data/bot.log
      - BOT_LOG_MAX_BYTES=10485760
      - BOT_LOG_BACKUP_COUNT=5
      - BOT_FULL_DEBUG_LOGS=true
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    volumes:
      - ./bot_data:/data
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib, sys, time; p = pathlib.Path('/data/loop_heartbeat'); sys.exit(0 if p.is_file() and time.time() - p.stat().st_mtime < 1500 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging: *default-logging
    restart: always

  log-tail:
    image: alpine:3.20
    labels:
      - dev.berangaria.logs=visible
    command:
      - sh
      - -c
      - |
        while [ ! -f /logs/bot.log ]; do
          echo "waiting for /logs/bot.log..."
          sleep 1
        done
        exec tail -n 300 -F /logs/bot.log
    depends_on:
      - bot
    volumes:
      - ./bot_data:/logs:ro
    network_mode: none
    logging: *default-logging
    restart: always

  dozzle:
    image: amir20/dozzle:v8.12.8
    environment:
      - DOZZLE_FILTER=label=dev.berangaria.logs=visible
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - log-tail
    logging: *default-logging
    restart: always

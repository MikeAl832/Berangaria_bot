# Единый лимит json-file логов: без него драйвер пишет без ограничения и
# заполняет диск VPS. Раньше лимит стоял только на log-tail.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api@sha256:39eb1b74c367e9a2fa7e7185a8e403a29f5c5d7bece8c0b9da441525ac8561c4
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    logging: *default-logging
    restart: always

  qdrant:
    # ВНИМАНИЕ: тег не закреплён, а деплой делает --force-recreate на каждый
    # push. При первой же потере кеша образов (новый VPS, docker image prune -a)
    # это мажорный апгрейд единственного сервиса с невосстановимым состоянием.
    # Закрепить нужно ту версию, что сейчас на проде:
    #   curl -s 127.0.0.1:6333 | grep -o '"version":"[^"]*"'
    image: qdrant/qdrant
    labels:
      - dev.berangaria.logs=visible
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    logging: *default-logging
    restart: always

  bot:
    build: .
    labels:
      - dev.berangaria.logs=visible
    env_file: .env
    environment:
      - BOT_DB_PATH=/data/bot_state.db
      - BOT_LOG_FILE=/data/bot.log
      - BOT_LOG_MAX_BYTES=10485760
      - BOT_LOG_BACKUP_COUNT=5
      # The operator explicitly keeps the full audit stream in bot.log/Dozzle.
      # It contains private prompts and replies; access to Dozzle must stay restricted.
      - BOT_FULL_DEBUG_LOGS=true
      - QDRANT_HOST=127.0.0.1
      - TELEGRAM_BOT_API_BASE_URL=http://127.0.0.1:8081
      - TELEGRAM_BOT_API_LOCAL_MODE=true
    depends_on:
      - qdrant
      - telegram-bot-api
    network_mode: host
    volumes:
      - ./bot_data:/data
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api:ro
    # Штатная остановка досушивает очередь памяти (сетевые вызовы к DeepSeek и
    # Mem0). Дефолтные 10 с гарантированно приводили к SIGKILL посреди прохода,
    # а потраченная попытка источника не возвращается.
    stop_grace_period: 120s
    logging: *default-logging
    restart: always

  log-tail:
    image: alpine:3.20
    labels:
      - dev.berangaria.logs=visible
    command:
      - sh
      - -c
      - |
        while [ ! -f /logs/bot.log ]; do
          echo "waiting for /logs/bot.log..."
          sleep 1
        done
        exec tail -n 300 -F /logs/bot.log
    depends_on:
      - bot
    volumes:
      - ./bot_data:/logs:ro
    network_mode: none
    logging: *default-logging
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    environment:
      - DOZZLE_FILTER=label=dev.berangaria.logs=visible
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - log-tail
    logging: *default-logging
    restart: always
